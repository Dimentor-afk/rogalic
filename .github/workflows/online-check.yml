# Перевірка, що публічне посилання на гру справді відкривається і гра запускається у браузері.
# Тимчасово: перебираємо CDN, що віддають файли з публічного GitHub-репозиторію, щоб знайти робочий.
name: Онлайн-версія

on:
  push:
    paths:
      - 'docs/play/**'
      - 'tools/smoke-online.mjs'
      - '.github/workflows/online-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - statically
          - jsdelivr
          - githack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Браузер для перевірки
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Перевірка (${{ matrix.host }})
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          case "${{ matrix.host }}" in
            statically) URL="https://cdn.statically.io/gh/$REPO/$SHA/docs/play/index.html" ;;
            jsdelivr)   URL="https://cdn.jsdelivr.net/gh/$REPO@$SHA/docs/play/index.html" ;;
            githack)    URL="https://rawcdn.githack.com/$REPO/$SHA/docs/play/index.html" ;;
          esac
          echo "$URL"
          node tools/smoke-online.mjs "$URL" "${{ matrix.host }}.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-${{ matrix.host }}
          path: '*.png'
