# Перевірки на кожен push/PR; на основній гілці репозиторію — ще й публікація гри на GitHub Pages.
# Публікація вмикається один раз: Settings → Pages → Source: «GitHub Actions».
# Поки Pages не увімкнено, крок публікації пропускається (з поясненням у журналі), перевірки лишаються зеленими.
name: CI і деплой

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Типи
        run: npm run typecheck
      - name: Тести
        run: npm test
      - name: Симуляція слота (1 000 000 спінів, фіксований seed) — RTP у цільовому діапазоні
        run: npm run sim -- 1000000 --seed 42
      - name: Збірка
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      # Спроба увімкнути Pages автоматично (джерело — GitHub Actions). Стандартному токену це може бути
      # заборонено — тоді крок не валить збірку, а Pages вмикається вручну в Settings → Pages.
      - name: Увімкнути GitHub Pages (якщо дозволено токеном)
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Чи увімкнено GitHub Pages
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages ще не увімкнено (Settings → Pages → Source: GitHub Actions) — публікацію пропущено."
          fi
      - id: pages
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
